version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smart_inventory_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smart_inventory
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smart_inventory']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_inventory_backend
    ports:
      - '5001:5000'
    environment:
      - DATABASE_URL=postgresql://postgres:secretpassword@db:5432/smart_inventory
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_inventory_frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  postgres_data:
