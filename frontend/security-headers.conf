# Cabeceras de seguridad del front.
#
# POR QUE ESTAN EN UN ARCHIVO APARTE
# ----------------------------------
# En nginx, `add_header` NO se hereda: si un `location` define CUALQUIER
# `add_header`, pierde TODOS los del nivel superior. Es la regla de nginx, y
# es la trampa clasica:
#
#     server { add_header X-Frame-Options "DENY"; ... }
#     location = /index.html { add_header Cache-Control "no-cache"; }
#     # -> /index.html se sirve SIN X-Frame-Options, sin Referrer-Policy y
#     #    sin Permissions-Policy. Y con `location = /` pasa lo mismo.
#
# La unica pagina HTML de la app es `/` (y `/index.html`), asi que sin este
# archivo la app entera se servia sin proteccion de framing ni de politica
# de permisos: cualquiera la podria embeber en un iframe (clickjacking) y la
# camara del escaner se permitia por defecto en vez de por politica.
#
# Con el `include` en cada bloque que define cabeceras, no hay forma de
# olvidarse una: si se agrega un `location` nuevo, hay que incluirlo, y el
# `include` esta a dos lineas de vista.

# La CSP es la defensa PRINCIPAL contra XSS, y su valor esta en lo que NO
# permite.
#
# `style-src 'unsafe-inline'`: es necesario porque la app aplica estilos
# inline con `style=` (el ancho de un QR, el color de un estado). Es un
# precio conocido: los estilos no ejecutan JavaScript.
#
# `script-src 'self'` SIN `unsafe-inline` y SIN `unsafe-eval`: aca no se cede
# nada. Un `<script>` inline no tendria hash, asi que no hay forma de que se
# ejecute.
#
# NO hay `fonts.googleapis.com` ni `fonts.gstatic.com`: la app no carga
# ninguna fuente externa (todo el CSS es propio), y dejar esos dominios
# permitidos era abrir la puerta a un tercero que no hace falta. Una politica
# de seguridad no puede tener permisos que nadie usa.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

# `nosniff`: el navegador no adivina el tipo de un archivo. Sin esto, un
# `.txt` con JavaScript served con el tipo equivocado se ejecuta.
add_header X-Content-Type-Options "nosniff" always;

# `DENY`: la app no se embebe en un iframe. El clickjacking usa justamente
# eso: un iframe invisible con la app debajo, y el operador hace clic sin
# ver donde.
add_header X-Frame-Options "DENY" always;

# No se manda la URL de la app a terceros. La app no tiene terceros, pero el
# `Referer` viaja igual a cualquier recurso externo que se agregara.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# `camera=(self)` y `geolocation=(self)`: el escaner necesita los dos.
# `microphone=()` porque la app no usa el microfono.
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;

# COOP: la app queda en su propio "grupo de navegacion". Sin esto, la
# ventana de impresion (que se abre con `window.open`) tendria
# `window.opener` y podria navegar la pestana de la app. Con COOP, esa
# relacion no existe.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CORP: ningun otro sitio puede embeber estos recursos. No hace falta para
# nada de la app, y por eso no se cede.
add_header Cross-Origin-Resource-Policy "same-origin" always;

# El service worker necesita esto para poder controlar la pagina.
add_header Service-Worker-Allowed "/" always;
