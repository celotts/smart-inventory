# Nginx del frontend.
#
# QUE HACE ESTE ARCHIVO Y POR QUE NO SE USA EL DE POR DEFECTO
# -----------------------------------------------------------
# El `default.conf` de nginx:alpine no trae CSP, ni cacheo, ni limites de
# cuerpo. Con la app anterior (Tailwind y html5-qrcode desde CDN) eso no
# importaba, porque hacia falta `unsafe-inline` para que Tailwind pudiera
# generar CSS con JavaScript. Ahora que la app es CSS propio y modulos ES,
# la CSP puede ser estricta sin ceder nada.
#
# LA CSP ES LA DEFENSA PRINCIPAL CONTRA XSS
# -----------------------------------------
# `script-src 'self'` — Y NO `'none'` — porque aca la pagina TIENE scripts
# propios (`/src/main.js` y sus modulos). Con `'none'` el navegador bloquea la
# aplicacion entera y queda una pantalla en blanco, sin error en consola que
# diga nada.
#
# Lo que `'self'` sigue tapando es lo que importa: nada inline (por eso todo el
# JS esta en modulos y no hay un solo `<script>` en el HTML) y nada de terceros
# (por eso no hay CDN).
#
# La API usa `script-src 'self'` a PROPOSITO: devuelve JSON y no tiene ningun
# script que ejecutar. Son politicas DISTINTAS, y copiar una en la otra rompe una
# de las dos. Ya paso: el frontend arranco con la de la API y no cargaba nada.
#
# `style-src 'self' 'unsafe-inline'`: el `unsafe-inline` de estilos es
# necesario porque hay estilos inline aplicados por JS (los de `style=`). Es
# un precio conhecido y acotado: los estilos no ejecutan JavaScript.

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Limites ------------------------------------------------------------
    # Un cuerpo de mas de 1 MB en esta app no existe: es un JSON con un codigo
    # de barras. El limite evita que un POST gigante ocupe el disco temporal
    # de nginx. La lectura del escaneo va por GET, asi que este limite casi
    # nunca se alcanza de verdad.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # -----------------------------------------------------------------
    # Headers de seguridad
    # -----------------------------------------------------------------
    # Las cabeceras de seguridad viven en `security-headers.conf` y se
    # INCLUYEN en cada bloque que define `add_header`.
    #
    # POR QUE UN INCLUDE Y NO UN BLOQUE ACA
    # --------------------------------------
    # En nginx, `add_header` no se hereda: si un `location` define CUALQUIER
    # `add_header`, pierde TODOS los del nivel superior. Sin el include, la
    # pagina principal (`/` y `/index.html`) se servia SIN `X-Frame-Options`,
    # SIN `Referrer-Policy` y SIN `Permissions-Policy`: la app entera sin
    # proteccion de framing (clickjacking) y con la camara permitida por
    # defecto en vez de por politica.
    include /etc/nginx/security-headers.conf;

    # -----------------------------------------------------------------
    # Cacheo
    # -----------------------------------------------------------------
    # El index NUNCA se cachea: es el archivo que apunta a los assets con
    # hash/nombre nuevos. Cacheado, un deploy no llega nunca a los usuarios que
    # ya visitaron la pagina.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # El service worker: SIEMPRE de la red. Un SW cacheado es un SW viejo
    # controlando la pagina para siempre.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        types { } default_type "application/manifest+json";
    }

    # El sello de build NUNCA se cachea. Es la unica forma de que la app sepa
    # que el servidor tiene una version nueva: si este archivo viniera del
    # cache, compararia consigo mismo y no recargaria nunca.
    location = /build.txt {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Los modulos y el CSS van con el hash del build en la URL: `/v/<hash>/src/main.js`.
    #
    # POR QUE AQUI SI PUEDE IR `immutable`
    # ------------------------------------
    # `immutable, max-age=31536000` dice "esto no cambia nunca". Es verdad,
    # porque la URL lleva el hash del contenido: si el archivo cambia, la URL
    # cambia con el, y el navegador pide un archivo nuevo.
    #
    # Sin el hash en la URL (que es como estaban antes: `/src/main.js` fijo),
    # `immutable` era una mentira que dejaba al navegador sirviendo un bundle
    # viejo para siempre, y `no-cache` no alcanzaba porque el service worker
    # lo interceptaba antes. Con el hash, el problema desaparece de raiz: no
    # hay ninguna entrada de cache vieja que pueda coincidir.
    location /v/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # El path sin version se mantiene por si algo lo pide: sin cache, para que
    # no sirva un archivo viejo.
    location /src/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /icons/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # --- API: solo proxy -----------------------------------------------------
    # En el compose, el frontend y la API estan en el mismo host. Servir la API
    # por el mismo origen hace que no haya CORS ni preflight, que es la
    # combinacion mas simple y la que menos superficie deja abierta.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los escaneos contra un modelo chico pueden tardar. 300 s (5 min) es lo que
        # el backend ya permite; un proxy con timeout de 60 cortaria una
        # consulta valida y el usuario veria un error que no es del backend.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering off para streaming responses (SSE, chunks grandes)
        proxy_buffering off;
        proxy_request_buffering off;

        # Nunca cachear respuestas de API: son datos vivos de inventario.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;

        # El backend pone su propia CSP (mas restrictiva: una API no tiene
        # scripts). Aca se agregan las que el backend NO pone y que el proxy
        # puede perder: `add_header` del proxy pisa las del backend si no se
        # reenvian explicitamente con `proxy_hide_header`.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # --- 404 ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
