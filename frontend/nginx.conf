# Nginx del frontend.
#
# QUE HACE ESTE ARCHIVO Y POR QUE NO SE USA EL DE POR DEFECTO
# -----------------------------------------------------------
# El `default.conf` de nginx:alpine no trae CSP, ni cacheo, ni limites de
# cuerpo. Con la app anterior (Tailwind y html5-qrcode desde CDN) eso no
# importaba, porque hacia falta `unsafe-inline` para que Tailwind pudiera
# generar CSS con JavaScript. Ahora que la app es CSS propio y modulos ES,
# la CSP puede ser estricta sin ceder nada.
#
# LA CSP ES LA DEFENSA PRINCIPAL CONTRA XSS
# -----------------------------------------
# `script-src 'none'` significa que ningun script puede ejecutarse en esta
# pagina: ni inline, ni de un CDN, ni de un origen distinto. Si una
# inyeccion de HTML se colara, no podria ejecutarse.
#
# `style-src 'self' 'unsafe-inline'`: el `unsafe-inline` de estilos es
# necesario porque hay estilos inline aplicados por JS (los de `style=`). Es
# un precio conhecido y acotado: los estilos no ejecutan JavaScript.

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Limites ------------------------------------------------------------
    # Un cuerpo de mas de 1 MB en esta app no existe: es un JSON con un codigo
    # de barras. El limite evita que un POST gigante ocupe el disco temporal
    # de nginx. La lectura del escaneo va por GET, asi que este limite casi
    # nunca se alcanza de verdad.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # -----------------------------------------------------------------
    # Headers de seguridad
    # -----------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # `camera=(self)` y `geolocation=(self)`: el escaner necesita los dos.
    # `microphone=()` porque la app no usa el microfono.
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;

    # El service worker necesita esto para poder controlar la pagina.
    add_header Service-Worker-Allowed "/" always;

    # -----------------------------------------------------------------
    # Cacheo
    # -----------------------------------------------------------------
    # El index NUNCA se cachea: es el archivo que apunta a los assets con
    # hash/nombre nuevos. Cacheado, un deploy no llega nunca a los usuarios que
    # ya visitaron la pagina.
    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # El service worker: SIEMPRE de la red. Un SW cacheado es un SW viejo
    # controlando la pagina para siempre.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600" always;
        types { } default_type "application/manifest+json";
    }

    # Los modulos y el CSS se cachean para siempre. No tienen hash en el
    # nombre, asi que esto se limpia con un redeploy que borre la cache: el
    # `VERSION` del service worker sube en cada cambio.
    location /src/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- API: solo proxy -----------------------------------------------------
    # En el compose, el frontend y la API estan en el mismo host. Servir la API
    # por el mismo origen hace que no haya CORS ni preflight, que es la
    # combinacion mas simple y la que menos superficie deja abierta.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los escaneos contra un modelo chico pueden tardar. 120 s es lo que
        # el backend ya permite; un proxy con timeout de 60 cortaria una
        # consulta valida y el usuario veria un error que no es del backend.
        proxy_connect_timeout 10s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;

        # Nunca cachear respuestas de API: son datos vivos de inventario.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # --- 404 ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
