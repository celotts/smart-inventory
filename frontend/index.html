<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="description" content="Inventario de activos con escaner de codigos, incidencias con SLA y mantenimiento" />

  <!--
    viewport-fit=cover + el padding con env(safe-area-inset-*) en el CSS es lo
    que hace que la app no quede bajo el notch ni el gesto de inicio del iPhone.
    Sin esto, en un iPhone el boton de abajo queda inaccesible.
  -->

  <title>Gestor de Activos · Inventario e incidencias</title>

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="stylesheet" href="/src/styles.css" />

  <!--
    =====================================================================
    SIN SCRIPT INLINE. TODO.
    =====================================================================
    Un `<script>` inline no puede tener un hash en la CSP, asi que la unica
    forma de permitirlo es `unsafe-inline`, que desactiva la proteccion contra
    XSS por completo. Ademas `unsafe-eval` esta PROHIBIDO a proposito: es lo que
    permite a un atacante ejecutar codigo de un string.

    La version anterior de esta pagina era UN archivo con ~250 lineas de
    `<script>` inline. Con `unsafe-inline` en la CSP, cualquier inyeccion de
    HTML se ejecuta. Por eso ahora todo el JS vive en modulos en /src y la CSP
    de nginx no necesita ceder nada.
  -->
</head>
<body>
  <!--
    El esqueleto estatico. Todo lo demas lo arma JavaScript usando textContent y
    createElement, NUNCA innerHTML.

    El `hidden` es la defensa en profundidad: si el JS no carga (error de red,
    404 del bundle, lo que sea), el usuario ve "cargando" en vez de un pantallon
    en blanco del que no puede salir.
  -->

  <a href="#contenido" class="saltar-al-contenido">Saltar al contenido</a>

  <header class="cabecera" id="cabecera" hidden>
    <!--
      LA CABECERA ES UNA GRID: DOS FILAS EN EL ESCRITORIO, TRES EN EL CELULAR

        [ Gestor de Activos ]  [ menu de secciones ]  [ sol · campana · salir ]
        [ 👤 quien ][ Inventario | Service Desk · Escanear ]

      Por que en GRID y no en flex con margenes automaticos: con margenes
      automaticos, el menu se centra repartiendo el espacio sobrante, asi que
      al cambiar de modulo (que cambia las pestanas y su ancho) TODO lo que
      esta a su alrededor se movia. El selector de modulo salia de un lado y
      volvia al otro, y el operador tenia que volver a buscarlo con la
      mirada.

      Con la grid, cada area tiene su lugar: cambiar de modulo cambia el
      menu (que es lo que tiene que cambiar) y NADA mas.

      Y por que el usuario y el selector de modulo en la MISMA fila: son las
      dos cosas de la segunda fila (quien esta y en que modulo esta), y
      Gestor de Activos solo, arriba, con su nombre entero.

      EN EL CELULAR LA CABECERA TIENE TRES FILAS
      -------------------------------------------
        [ marca ]                [ idioma · nuevo · sol · campana · salir ]
        [ 👤 quien ][ Inventario | Service Desk · Escanear ]
        [ menu de secciones, con TODAS las pestanas ]

      El menu de secciones estaba en la PRIMERA fila, al lado de la marca, y
      en el celular no cabia: la marca y los botones de la derecha se
      comian el ancho y el menu quedaba con un pedazo de 130 pixeles, con
      dos o tres iconos y el resto escondido (con un scroll que nadie
      descubre). El menu de secciones es lo que mas se usa: no puede ser lo
      que se pierde.

      Por eso en el celular el menu pasa a su PROPIA fila, del ancho de la
      pantalla: todas las pestanas se ven, y si no entran, scrollean a lo
      ancho con el desvanecido del borde.
    -->
    <div class="cabecera__marca">
      <span class="cabecera__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 7l9-4 9 4v10l-9 4-9-4z" stroke-linejoin="round"/>
          <path d="M3 7l9 4 9-4M12 11v10" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>Gestor de Activos</span>
    </div>

    <!--
      LA SEGUNDA FILA DE LA CABECERA
      --
      El usuario (a la izquierda, con su "Rol: Admin") y el selector de
      modulo (CENTRADO respecto de la PAGINA).

      El selector va centrado con una posicion absoluta: en una grilla, el
      centro de una celda no es el centro de la pagina, asi que "centrar la
      celda" dejaria los botones corrida hacia un lado.
    -->
    <div class="cabecera__fila2">
    <div class="cabecera__usuario" id="cabecera-usuario" hidden>
      <div class="cabecera__usuario-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4" stroke-linecap="round"/>
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="cabecera__usuario-info">
        <span class="cabecera__usuario-nombre" id="cabecera-usuario-nombre"></span>
        <span class="cabecera__usuario-rol" id="cabecera-usuario-rol"></span>
      </div>
    </div>

    <!--
      EL SELECTOR DE TRABAJO
      --
      Inventario | Service Desk (el modulo en el que se esta) y Escanear (la
      vista de escaneo), AL MISMO NIVEL: los tres son "a donde ir" desde la
      cabecera, y los tres tienen que estar a la vista siempre.

      Escanear fue una pestana del menu de secciones, y en el celular eso la
      escondia: el menu es una fila que scrollea y la pestana se iba con
      ella. El escaneo es la tarea del deposito y tiene que estar a un clic,
      sin scrollear.

      El grupo va centrado con una posicion absoluta (en una grilla, el
      centro de una celda no es el centro de la pagina, asi que "centrar la
      celda" dejaria los botones corridos hacia un lado). Por eso el grupo
      entero --modulos y escanear-- es lo que se centra, y no cada parte
      por separado.
    -->
    <div class="cabecera__selector" id="cabecera-selector">
    <div class="cabecera__modulos" id="cabecera-modulo" role="group" aria-label="Modulo de trabajo" hidden></div>

    <!--
      ESCANEAR: registrar un movimiento escaneando la etiqueta del equipo.

      Es una ACCION, no un modulo: no cambia el area de trabajo (el operador
      sigue en Inventario y sus pestanas siguen ahi), solo abre la vista del
      escaner. Por eso vive al lado del selector de modulo y no dentro de
      el.
    -->
    <button class="cabecera__escanear" id="cabecera-escanear" data-vista="escanear" hidden
            title="Escanear un equipo (registrar un movimiento)"
            aria-label="Escanear un equipo">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2" stroke-linecap="round"/>
        <path d="M3 12h18" stroke-linecap="round"/>
      </svg>
      <span class="cabecera__escanear-texto">Escanear</span>
    </button>
    </div>
    </div>

    <nav class="cabecera__nav" aria-label="Secciones">
      <button class="pestana" data-vista="inicio" aria-current="page" title="Inicio">
        <span class="pestana__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12l9-8 9 8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 10v10h14V10" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="pestana__texto">Inicio</span>
      </button>

      <!--
        EL MENU DE SECCIONES
        --
        Las secciones del modulo en el que se esta trabajando. El escaneo NO
        esta aqui: vive en la cabecera, al lado del selector de modulo
        (ver `#cabecera-escanear`), porque en el celular un menu que
        scrollea esconde lo que esta al final, y el escaneo es lo que mas
        se usa en el deposito.
      -->

      <button class="pestana" data-vista="inventario" id="pestana-inventario" hidden title="Inventario">
        <span class="pestana__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7l9-4 9 4v10l-9 4-9-4z" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="pestana__texto">Inventario</span>
      </button>

      <!--
        La existencia: cuanto hay de cada rubro y donde. Es la pantalla que
        responde "cuanto hay de cada cosa", que antes no existia en ninguna
        parte de la app.
      -->
      <button class="pestana" data-vista="existencia" id="pestana-existencia" hidden title="Existencia">
        <span class="pestana__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/>
            <path d="M7 4v4M14 10v4M20 16v4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="pestana__texto">Existencia</span>
      </button>

      <button class="pestana" data-vista="movimientos" id="pestana-movimientos" hidden title="Movimientos">
        <span class="pestana__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 9l-3 3 3 3M19 15l3-3-3-3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12h20" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="pestana__texto">Movimientos</span>
      </button>

      <button class="pestana" data-vista="incidencias" id="pestana-incidencias" hidden title="Incidencias">
        <span class="pestana__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke-linejoin="round"/>
            <path d="M12 9v4M12 17h.01" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="pestana__texto">Incidencias</span>
      </button>

      <button class="pestana" data-vista="consultas" id="pestana-consultas" hidden title="Consultas">
        <span class="pestana__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="pestana__texto">Consultas</span>
      </button>

      <button class="pestana" data-vista="productos" id="pestana-productos" hidden title="Productos">
        <span class="pestana__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke-linejoin="round"/>
            <path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="pestana__texto">Productos</span>
      </button>

      <button class="pestana" data-vista="compras" id="pestana-compras" hidden title="Compras">
        <span class="pestana__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="pestana__texto">Compras</span>
      </button>

      <button class="pestana" data-vista="auditoria" id="pestana-auditoria" hidden title="Auditoría">
        <span class="pestana__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 8v4l3 2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3.05 11a9 9 0 1116.95 4M3 4v4h4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="pestana__texto">Auditoría</span>
      </button>

      <button class="pestana" data-vista="usuarios" id="pestana-usuarios" hidden title="Usuarios">
        <span class="pestana__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="9" cy="7" r="4" stroke-linecap="round"/>
            <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="pestana__texto">Usuarios</span>
      </button>

    </nav>

    <div class="cabecera__acciones">
    <!--
      EL IDIOMA
      --
      El idioma de la INTERFAZ. Los datos (los SKUs, los nombres de los
      equipos) no se tocan: son los que son.
    -->
    <button class="cabecera__idioma" id="btn-idioma" title="Idioma / Language" aria-label="Cambiar el idioma / Change language">
      <span class="cabecera__idioma-texto" id="btn-idioma-texto">ES</span>
    </button>
    <!--
      DAR DE ALTA UN EQUIPO: una ACCION, no una seccion.
      --
      Con "Nuevo" en el menu, el menu del admin era mas ancho que su
      columna y la ultima pestana quedaba metida debajo de estos botones.
      Ademas, "Nuevo" no es un lugar de la app: es HACER algo. Va aqui, con
      la campana y el salir, que es donde estan las acciones.
    -->
    <button class="cabecera__nuevo" id="pestana-nuevo" data-vista="nuevo" hidden
            title="Dar de alta un equipo (nuevo)"
            aria-label="Dar de alta un equipo nuevo">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
      </svg>
      <span class="cabecera__nuevo-texto">Nuevo</span>
    </button>
    <!--
      El modo exterior (alto contraste para trabajar al sol).

      Va DENTRO del grupo de la derecha: si queda fuera, la cabecera (que es
      una grid de tres columnas) lo manda a una fila de mas y el boton queda
      flotando solo, abajo de todo.
    -->
    <button class="cabecera__exterior" id="btn-exterior" 
            aria-pressed="false" 
            aria-label="Alternar modo exterior (alto contraste)"
            title="Modo exterior / alto contraste (para sol directo)">
      <svg class="cabecera__exterior-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="5" stroke-linecap="round"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!--
      (El selector de modulo va antes, como hijo directo de la cabecera: en
      el celular baja a su propia fila.)
    -->

    <!--
      La campana de avisos de SLA.

      El badge con el numero es lo que el operador ve de reojo: un caso que
      se pasa de plazo sin que nadie mire la lista de incidencias es un SLA
      que no existe.
    -->
    <button class="cabecera__campana" id="btn-campana" hidden
            aria-label="Avisos de SLA"
            title="Avisos de SLA">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.73 21a2 2 0 01-3.46 0" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="cabecera__campana-contador" id="campana-contador" hidden>0</span>
    </button>

    <button class="cabecera__salir" id="btn-salir" title="Cerrar sesion" aria-label="Cerrar sesion">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    </div>
  </header>

  <main id="contenido" class="contenido">
    <!-- Estados de carga / error. Se cambian por texto, nunca por innerHTML. -->
    <div class="cargando" id="cargando">
      <div class="cargando__spinner" aria-hidden="true"></div>
      <p>Cargando…</p>
    </div>
  </main>

  <!--
    El aviso de conexion. Aparece SOLO cuando hay un escaneo en la cola sin
    enviar. `role="status"` + `aria-live="polite"` hace que un lector de pantalla
    lo anuncie sin interrumpir: es un aviso, no una alarma.
  -->
  <div id="aviso-offline" class="aviso-offline" role="status" aria-live="polite" hidden></div>

  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <!-- Footer con info legal, versión y estado técnico -->
  <footer class="footer" role="contentinfo">
    <div class="footer__grid">
      <div class="footer__brand">
        <strong>FC Quality</strong>
        <span class="footer__year">2026</span>
      </div>
      <div class="footer__meta">
        <span class="footer__version" id="footer-version">v0.5.0</span>
        <span class="footer__env" id="footer-env" data-env="development">DEV</span>
      </div>
      <nav class="footer__legal" aria-label="Enlaces legales">
        <a href="/terminos">Términos</a>
        <a href="/privacidad">Privacidad</a>
        <a href="mailto:soporte@fcquality.com">Soporte</a>
      </nav>
      <div class="footer__tech" aria-label="Info técnica">
        <span>Build: <code id="build-hash">—</code></span>
        <span id="ai-status">IA: verificando…</span>
      </div>
    </div>
  </footer>

  <!--
    El vigilante de arranque va ANTES de main.js y en un archivo aparte, a
    proposito: si el problema esta en main.js —un bundle roto en la cache, un
    service worker que sirve una version vieja— un vigilante dentro de
    main.js no llega a ejecutarse nunca. Este lo reemplaza por un mensaje con
    boton de recargar en vez de dejar el "Cargando…" girando para siempre.
  -->
  <script type="module" src="/src/arranque.js"></script>
  <script type="module" src="/src/main.js"></script>
  <noscript>
    <p style="padding:2rem;text-align:center">
      Esta aplicacion necesita JavaScript para funcionar.
    </p>
  </noscript>
</body>
</html>
